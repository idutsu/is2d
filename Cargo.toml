[package]
name = "is2d"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
kurbo = "0.13"
lyon_tessellation = "1.0"
i_overlay = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std", "simd"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL", "NSValue"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-media", "objc2-core-video", "AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["std", "CMTime"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["std", "objc2", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool", "CVReturn"] }
block2 = "=0.6.2"

[dev-dependencies]
fastrand = "2"
