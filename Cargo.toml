[package]
name = "is2d"
version = "0.1.0"
edition = "2021"

[dependencies]
# 要る機能だけ：描画（glow）と読み上げ（accesskit）。egui の既定のフォントは入れない（文字は fonts/ の NotoSansJP と
# MaterialIcons で描く：`configure_japanese_fonts`）。Linux の窓（x11・wayland）とウェブの機能も入れない（macOS 用）
eframe = { version = "0.31", default-features = false, features = ["accesskit", "glow"] }
kurbo = "0.13"
lyon_tessellation = "1.0"
# 地図の重ね合わせと、ブラシの輪郭の自己交差の解消（vendor/i_overlay。9.1.0 に足した所がある写し。vendor/i_overlay/PATCH.md）
i_overlay9 = { package = "i_overlay", path = "vendor/i_overlay" }
serde = { version = "1.0", features = ["derive", "rc"] }
# .is2d の中身（保存用の型を postcard で書く。書き方の仕様は 1.0 から変わらない）と、中身の CRC32（eframe も PNG のために使う）
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
crc32fast = "1.5"
rfd = "0.15"
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std", "simd"] }
# 音の読み込み（WAV・MP3 を波形に直す。Rust だけで書かれているので、テストで OS を使わずに確かめられる）
symphonia = { version = "=0.5.4", default-features = false, features = ["wav", "pcm", "mp3"] }
# 音の出力（macOS では Core Audio。再生とスクラブの音を鳴らし、鳴らした量で再生のコマを進める：src/audio_out.rs）
cpal = { version = "=0.15.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSCell", "NSEvent", "NSMenu", "NSMenuItem", "NSPasteboard", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL", "NSValue"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-media", "objc2-core-video", "AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings"] }
# 音の入力（AAC）へ渡す音の塊（CMSampleBuffer）とその形（CMAudioFormatDescription・AudioStreamBasicDescription）を作る
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["std", "objc2", "objc2-core-audio-types", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime"] }
objc2-core-audio-types = { version = "=0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["std", "objc2", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool", "CVReturn"] }
block2 = "=0.6.2"
# 音の出力の装置の遅れ（装置・安全分・流れの遅れ）を OS に聞く（再生のコマを、耳に届いた音に合わせる：src/audio_out.rs）。
# cpal がもう使っている版と機能にそろえ、増やさない
coreaudio-sys = { version = "=0.2.18", default-features = false, features = ["core_audio"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux で窓を開く仕組み（X11）。Linux でもビルドしてテストを回せるようにする（サーバーでのレビュー）。macOS・Windows には効かない
eframe = { version = "0.31", default-features = false, features = ["x11"] }

[target.'cfg(windows)'.dependencies]
# 動画の書き出し（Media Foundation の書き込む係 IMFSinkWriter で、H.264・AAC の MP4 を書く：src/video_export_windows.rs）・
# セッションの終わりを受け取ってアプリが止められる前に復旧ファイルを書くこと（src/session_end_windows.rs）と、
# そのための COM の始まり・終わり、Media Foundation の DLL があるかの確かめ。版は eframe（accesskit_windows）が Windows で
# もう使っている 0.58.0 にそろえ、同じ道具の2つ目の版を増やさない
windows = { version = "=0.58.0", default-features = false, features = ["std", "Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Shutdown", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# セッションの終わり（ログアウト・再起動）を受け取るために、アプリの窓を引く（src/session_end_windows.rs）。eframe と同じ版
raw-window-handle = "=0.6.2"

[dev-dependencies]
fastrand = "2"
# テストで、保存用の型を文字から作ったり、中を見たりする
serde_json = { version = "1.0", features = ["float_roundtrip"] }
